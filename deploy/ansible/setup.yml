---
# Prepares a Debian/Ubuntu server to run the app:
#   ansible-playbook -i hosts setup.yml
- name: Prepare server
  hosts: server
  become: true
  roles:
    - docker
  tasks:
    - name: Install packages
      ansible.builtin.apt:
        pkg: [git, ufw, rclone, curl, ca-certificates]
        state: present
        update_cache: true

    - name: Allow SSH, HTTP and HTTPS through the firewall
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
      loop: ["22", "80", "443"]

    - name: Enable firewall
      community.general.ufw:
        state: enabled
        policy: deny
